<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-lg p-8 shadow-lg">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Login</h1>
            <p class="text-slate-400 text-sm italic">Advanced Encryption and Decryption Tool</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase">Email</label>
                <input type="email" id="login-email" class="w-full bg-slate-800 border border-slate-700 rounded py-2 px-3 text-white focus:outline-none focus:border-emerald-500" required>
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase">Password</label>
                <input type="password" id="login-pass" class="w-full bg-slate-800 border border-slate-700 rounded py-2 px-3 text-white focus:outline-none focus:border-emerald-500" required>
            </div>
            <p id="login-error" class="text-red-500 text-xs text-center hidden"></p>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded transition-colors uppercase text-sm tracking-widest">
                Login
            </button>
        </form>
    </div>
</div>
